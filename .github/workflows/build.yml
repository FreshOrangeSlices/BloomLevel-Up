# Builds the mod and runs unit tests on every push / PR.
# The finished jar is attached to each run under "Artifacts" (Actions tab -> the run -> bloomlevelup-jar).

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build runGameTest --stacktrace 2>&1 | tee build.log
          # The game tests again with Better Combat loaded (after the plain run, so the two logs don't interleave).
          ./gradlew runGameTestBetterCombat --stacktrace 2>&1 | tee -a build.log
      # Always leave a one-line game test summary on the run (readable through the checks API).
      - name: report game tests
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('build.log'):
              raise SystemExit(0)
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          hits = [l.strip() for l in lines if re.search(r'GAME TESTS|required tests|optional tests|tests? failed|failed!|GameTestAssert|Task :runGameTest|BLOOMTEST', l)]
          text = '\n'.join(hits[-40:]) or 'no game test output found'
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::notice title=gametest-summary::{esc(text[:3900])}")
          PY
      # A fingerprint and a virus scan of the jar, shown on the run, so a download can be checked against it.
      - name: check jar
        if: success()
        run: |
          set +e
          ls build/libs/*.jar | grep -v -- '-sources.jar' > jars.txt
          sha256sum $(cat jars.txt) | sed 's#build/libs/##' > jar-sha256.txt
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq clamav > /dev/null 2>&1
          sudo systemctl stop clamav-freshclam > /dev/null 2>&1
          sudo freshclam --quiet > /dev/null 2>&1
          clamscan --no-summary $(cat jars.txt) > clam.txt 2>&1
          status=$?
          verdict=$([ $status -eq 0 ] && echo "ClamAV: clean" || echo "ClamAV exit $status: $(tr '\n' ' ' < clam.txt)")
          echo "::notice title=jar-check::Build ${GITHUB_RUN_NUMBER} ($(cut -c1-7 <<< "$GITHUB_SHA")) | SHA-256 $(tr '\n' ' ' < jar-sha256.txt)| $verdict"
      - name: capture build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bloomlevelup-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      # On failure, surface the compiler / test errors as annotations on the run,
      # so they are readable from the run's summary page and the checks API.
      - name: report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('build.log'):
              raise SystemExit(0)
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          keep = []
          for i, line in enumerate(lines):
              if re.search(r'(error:|warning: \[|FAILED|What went wrong|Exception|expected:|> Task .*FAILED|GameTest|gametest|Mixin)', line):
                  keep.extend(lines[max(0, i - 1):i + 6])
          text = '\n'.join(dict.fromkeys(keep)) or '\n'.join(lines[-200:])
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          # Annotations are cut at 4096 chars and capped at 10 per type per step.
          chunks = [text[i:i + 3900] for i in range(0, len(text), 3900)][:30]
          kinds = ['error', 'warning', 'notice']
          for n, chunk in enumerate(chunks):
              print(f"::{kinds[n // 10]} title=build-errors-{n:02d}::{esc(chunk)}")
          PY
      - name: capture test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/

  # The Bloom Pack for friends (pack/pack.json): a Modrinth pack file (.mrpack) and the server's mods, under
  # "Artifacts" as bloom-pack. Then a real Fabric server boots with those server mods, to be sure it starts.
  pack:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch the mod jar
        uses: actions/download-artifact@v4
        with:
          name: bloomlevelup-jar
          path: jar
      - name: build the pack
        run: python3 pack/build_pack.py "$(ls jar/*.jar | head -1)" "build.${GITHUB_RUN_NUMBER}" out
      - name: capture the pack
        uses: actions/upload-artifact@v7
        with:
          name: bloom-pack
          path: |
            out/*.mrpack
            out/*.zip
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: boot a server with the pack
        run: python3 pack/boot_server.py "out/Bloom Pack build.${GITHUB_RUN_NUMBER} server mods.zip" 26.3 0.19.5
