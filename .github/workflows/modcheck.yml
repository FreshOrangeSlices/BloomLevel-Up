# Throwaway (never merged): what the companion mods add (companioncheck.sh), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/checkout@v6
        with:
          ref: forge-1.20.1
          path: bloom
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: bash check/attrcheck.sh
