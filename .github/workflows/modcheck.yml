# Throwaway (never merged): the pack's natural spawns, from a pack run's artifacts (spawnscan.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: echo "RUN_ID=$(cat check/run-id.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: pack-screenshots-L6
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: legionwarex
          path: pack
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          mkdir -p data-out/emsc2
          python3 check/emsc2.py "$(ls pack/*server*.zip | head -1)" data-out/emsc2/emsc2.txt | tee summary.txt
          echo "::notice title=emsc2::$(tr '\n' '|' < summary.txt)"
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          mkdir -p data/emsc2 && cp data-out/emsc2/* data/emsc2/ && cd data && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "emsc2" && git push -q origin ci/data && echo pushed
