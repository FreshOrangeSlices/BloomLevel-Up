# Throwaway (never merged): shader loader and shader packs for LegionWareX (shaders.py).
name: modcheck
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/checkout@v6
        with:
          ref: forge-1.20.1
          path: bloom
      - name: versions
        run: python3 check/versions.py book-of-dragons easy-mob-spawn-control
