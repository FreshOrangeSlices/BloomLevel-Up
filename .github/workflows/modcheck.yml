# Throwaway (never merged): what in the pack touches underground generation (underground.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: echo "RUN_ID=$(cat check/run-id.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: legionwarex
          path: pack
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          rm -rf data-out; mkdir -p data-out/underground
          python3 check/underground.py "$(ls pack/*server*.zip | head -1)" data-out/underground/scan.json | tee data-out/underground/summary.txt
          echo "::notice title=underground::$(head -c 3000 data-out/underground/summary.txt | tr '\n' '|')"
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          mkdir -p data/underground && cp -r data-out/underground/* data/underground/ && cd data && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "underground" && git push -q origin ci/data && echo pushed
