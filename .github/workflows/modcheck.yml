# Throwaway (never merged): Origins and its add-ons for Forge 1.20.1 (origins.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - run: python3 check/obody.py
      - run: |
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          cp origins-bodies.json data/ && cd data && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "Origins bodies" && git push -q origin ci/data
