name: probe
on: push
permissions:
  actions: read
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSL -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar && python3 probe/analyse.py .
      - if: always()
        run: python3 probe/emit.py 0 30
      - run: python3 probe/emit.py 30 30
      - run: python3 probe/emit.py 60 30
      - run: python3 probe/emit.py 90 30
      - if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-out-tmp
          git rm -rf --cached . > /dev/null
          git add -f probe-out report.txt
          git commit -qm "probe output"
          git push -f origin HEAD:refs/heads/ci/probe-bossesrise-out
