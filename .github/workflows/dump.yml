# Throwaway (never merged): looks up Forge 1.20.1 versions on Modrinth and decompiles Better Combat's classes Bloom
# hooks into, then commits the results to this branch so they can be read without the job logs.
name: api-dump
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: look up versions and decompile
        run: |
          set -x
          mkdir -p out jars
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = {"User-Agent": "FreshOrangeSlices/BloomLevel-Up api dump (github actions)"}
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA)))
          slugs = {"mod": ["better-combat", "playeranimator", "player-animation-library", "cloth-config", "entity-model-features",
                           "entitytexturefeatures", "not-enough-animations", "emf-compat-better-combat", "not-enough-animations-emf-compat",
                           "fa-player-extension"],
                   "pack": ["fresh-animations", "fresh-animations-details", "fresh-animations-objects", "fresh-animations-spiders",
                            "fresh-animations-creepers", "fa-player-extension"]}
          report = {}
          for kind, names in slugs.items():
              for slug in names:
                  for loader in (["forge"] if kind == "mod" else ["minecraft"]):
                      q = urllib.parse.urlencode({"loaders": json.dumps([loader]), "game_versions": json.dumps(["1.20.1"])})
                      try:
                          versions = get(f"https://api.modrinth.com/v2/project/{slug}/version?{q}")
                      except Exception as e:
                          report[f"{slug}/{loader}"] = f"error {e}"; continue
                      report[f"{slug}/{loader}"] = [{"id": v["id"], "number": v["version_number"], "date": v["date_published"],
                          "loaders": v["loaders"], "games": v["game_versions"][-6:],
                          "files": [f["url"] for f in v["files"]][:2],
                          "deps": [(d.get("project_id"), d["dependency_type"]) for d in v["dependencies"]]} for v in versions[:4]]
          json.dump(report, open("out/modrinth-1.20.1.json", "w"), indent=1)
          # The jars to decompile: the newest Better Combat and playerAnimator for Forge 1.20.1.
          for slug in ("better-combat", "playeranimator"):
              entries = report.get(f"{slug}/forge")
              if isinstance(entries, list) and entries:
                  url = entries[0]["files"][0]
                  urllib.request.urlretrieve(urllib.request.Request(url, headers=UA).full_url, f"jars/{slug}.jar")
          PY
          ls -la jars
          curl -sSL -o vineflower.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
          for j in jars/*.jar; do
            name=$(basename $j .jar)
            unzip -l $j | awk '{print $4}' | grep -E '\.class$|\.json$|mods.toml|mixins' > out/$name-files.txt || true
            mkdir -p out/$name
            java -jar vineflower.jar -dgs=1 $j out/$name/ > /dev/null 2>&1 || true
            (cd out/$name && unzip -oq *.jar 2>/dev/null; rm -f *.jar) || true
          done
          # Keep only Better Combat's and playerAnimator's sources and metadata (small enough to commit).
          find out -name '*.class' -delete
          du -sh out/* || true
      - name: commit the results
        run: |
          git config user.name "api-dump"
          git config user.email "api-dump@users.noreply.github.com"
          git add out
          git commit -qm "api dump results" || true
          git push origin HEAD:ci/api-dump-forge-bc
