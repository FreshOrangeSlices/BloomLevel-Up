# Throwaway (never merged): Legionary's flaming skull on a dedicated server (skull.sh).
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: bash check/skull.sh > out.txt 2>&1; cat out.txt
      - run: python3 check/slice.py out.txt 0 9
