name: api-dump
on:
  push:
    branches: ['ci/api-dump*']
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew printClasspath --no-configuration-cache -q
      - name: javap
        run: |
          set +e
          CP="$(cat build/cp.txt)"
          dump() { echo "=== $1"; javap -p -cp "$CP" "$1" 2>&1 | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g' | { if [ -n "$2" ]; then grep -E "class |interface |enum |$2"; else cat; fi; }; }
          code() { echo "=== CODE $1 :: $2"; javap -c -p -cp "$CP" "$1" 2>&1 | awk -v pat="$2" 'BEGIN{p=0} /^  [a-z].*\(/ { p = ($0 ~ pat) } p { print }' | sed -E 's/net\/minecraft\///g; s/net\.minecraft\.//g' | grep -vE '^\s+[0-9]+: (aload|iload|fload|dload|astore|istore|fstore|dstore|dup|pop|iconst|fconst|dconst|aconst_null|ldc|bipush|sipush|i2f|f2d|d2f|i2d|f2i|checkcast|return|areturn|ireturn|freturn)' ; }
          {
          code net.minecraft.world.entity.player.Inventory 'placeItemBackInInventory'
          dump net.minecraft.world.entity.player.Player ' drop[(]|createItemStackToDrop|handleCreativeModeItemDrop'
          dump net.minecraft.server.level.ServerPlayer ' drop[(]|createItemStackToDrop'
          dump net.minecraft.world.entity.LivingEntity ' drop[(]|createItemStackToDrop|spawnAtLocation'
          code net.minecraft.world.entity.player.Player 'ItemEntity drop[(]'
          code net.minecraft.server.level.ServerPlayer 'ItemEntity drop[(]|boolean drop[(]'
          code net.minecraft.server.network.ServerGamePacketListenerImpl 'void handleSetCreativeModeSlot'
          dump net.minecraft.client.gui.screens.MenuScreens 'register|class '
          dump net.minecraft.world.inventory.MenuType 'MenuType[(]|MenuSupplier|class '
          dump 'net.minecraft.world.inventory.MenuType$MenuSupplier'
          dump net.minecraft.world.flag.FeatureFlags 'VANILLA_SET|DEFAULT_FLAGS|class '
          code net.minecraft.world.level.block.entity.HopperBlockEntity 'tryMoveInItem'
          dump net.minecraft.client.gui.screens.inventory.ContainerScreen 'ContainerScreen[(]|class '
          } > dump.txt 2>&1
          wc -c dump.txt
      - name: publish (1)
        run: python3 emit.py 0 30
      - name: publish (2)
        run: python3 emit.py 30 50
