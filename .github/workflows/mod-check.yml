name: mod-check
on:
  push:
    branches: [ "ci/mod-check" ]
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NEW: wizards,paladins-and-priests,archers,rogues-and-warriors,arsenal-rpg-series,armory-rpg-series,jewelry,combat-roll
    steps:
      - uses: actions/checkout@v6
      - name: scout
        run: python3 pack/scout2.py "remnants-eclipsed-realm,remnants-rpg-mobs,moar-bosses"
      - name: scout 2
        run: python3 pack/scout2.py "ultimate-warden,mutant-monsters,remnants-rpg-stats-skills-progression"
