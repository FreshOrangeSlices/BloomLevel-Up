# Throwaway (never merged): LegionWareX's mod descriptions (desc.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/checkout@v6
        with:
          ref: forge-1.20.1
          path: bloom
      - run: python3 check/desc.py
      - run: |
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          cp descriptions.json data/ && cd data
          git -c user.name=ci -c user.email=ci@example.invalid commit -qam "LegionWareX mod descriptions" || git -c user.name=ci -c user.email=ci@example.invalid commit -qm "LegionWareX mod descriptions" --allow-empty
          git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -qm "descriptions" || true
          git push -q origin ci/data
