# Boots a real Minecraft client with the mod into a singleplayer world (client mixins, hub, sync).
# Screenshots are attached to each run under "Artifacts" (client-test-screenshots); the hub's are also
# printed as annotations by the "screenshots" job (see .github/scripts/emit_screenshot.py).

name: client-test
on: [push, workflow_dispatch]

jobs:
  client-test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: graphics drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: client game tests
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew runClientGameTest --stacktrace 2>&1 | tee client.log
      - name: report client tests
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('client.log'):
              raise SystemExit(0)
          lines = open('client.log', encoding='utf-8', errors='replace').read().splitlines()
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          keep = []
          for i, line in enumerate(lines):
              if re.search(r'(error:|ERROR|FAILED|What went wrong|Exception|Caused by|AssertionError|Mixin|BLOOMTEST)', line):
                  keep.extend(lines[max(0, i - 1):i + 5])
          text = '\n'.join(dict.fromkeys(keep)) or '\n'.join(lines[-120:])
          chunks = [text[i:i + 3900] for i in range(0, len(text), 3900)][:20]
          kinds = ['warning', 'notice']
          for n, chunk in enumerate(chunks):
              print(f"::{kinds[(n // 10) % 2]} title=client-log-{n:02d}::{esc(chunk)}")
          tail = '\n'.join(lines[-25:])
          print(f"::notice title=client-summary::{esc(tail[:3900])}")
          PY
      - name: capture screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-screenshots
          path: |
            build/run/clientGameTest/screenshots
            run/screenshots
            **/screenshots/*.png
          if-no-files-found: ignore

  screenshots:
    needs: client-test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch screenshots
        uses: actions/download-artifact@v4
        with:
          name: client-test-screenshots
          path: shots
      - name: pillow
        run: pip install --quiet pillow
      - name: the Combat stat sheet
        run: python3 .github/scripts/emit_screenshot.py shots bloom_sheet_combat 12
      - name: the Armor stat sheet, hit by a zombie
        run: python3 .github/scripts/emit_screenshot.py shots bloom_sheet_armor 12
      - name: the HUD's skill icons, bottom right
        run: python3 .github/scripts/emit_screenshot.py shots bloom_hud_icons 12
      - name: the HUD with Brace! on
        run: python3 .github/scripts/emit_screenshot.py shots bloom_hud_braced 12

  # The client again with Better Combat loaded: a charged Charge Attack swing has to play the slam. Its two
  # screenshots (wind-up, landing) are printed as annotations here.
  client-test-bettercombat:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: graphics drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: client game tests with Better Combat
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew runClientGameTestBetterCombat --stacktrace 2>&1 | tee client-bc.log
      - name: report
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('client-bc.log'):
              raise SystemExit(0)
          lines = open('client-bc.log', encoding='utf-8', errors='replace').read().splitlines()
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          keep = []
          for i, line in enumerate(lines):
              if re.search(r'(error:|ERROR|FAILED|What went wrong|Exception|Caused by|AssertionError|Mixin|BLOOMTEST)', line):
                  keep.extend(lines[max(0, i - 1):i + 5])
          text = '\n'.join(dict.fromkeys(keep)) or '\n'.join(lines[-120:])
          chunks = [text[i:i + 3900] for i in range(0, len(text), 3900)][:8]
          for n, chunk in enumerate(chunks):
              print(f"::warning title=client-bc-log-{n:02d}::{esc(chunk)}")
          tail = '\n'.join(lines[-25:])
          print(f"::notice title=client-bc-summary::{esc(tail[:3900])}")
          PY
      - name: pillow
        if: always()
        run: pip install --quiet pillow
      - name: the throw, winding up
        if: always()
        run: python3 .github/scripts/emit_screenshot.py build/run/clientGameTestBetterCombat bloom_bc_throw_windup 12
      - name: the throw, just let go
        if: always()
        run: python3 .github/scripts/emit_screenshot.py build/run/clientGameTestBetterCombat bloom_bc_throw_release 12
      - name: thrown weapons in flight (axe, sword, spear)
        if: always()
        run: python3 .github/scripts/emit_screenshot.py build/run/clientGameTestBetterCombat bloom_thrown_weapons 12

  # The whole Bloom Pack on a real client: the pack's client mods, Fresh Animations and its player extension, and the
  # Complementary shader, as the .mrpack installs them (Bloom itself comes from this commit). It has to start, make a
  # normal world and open the hub; the pack-screenshots job prints what it looked like.
  # Variants: "full" is the pack as shipped; the others leave a suspect out, to compare the mob close-ups.
  client-test-pack:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Add a variant with "without: <slug,slug>" to compare the pack without a suspect (round 12 compared
        # Better Animations Collection this way).
        include:
          - variant: full
            without: ""
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: graphics drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: the pack's client side
        run: |
          mkdir -p fake && cd fake
          printf '{"schemaVersion":1,"id":"bloomlevelup","version":"0.0.0","environment":"*","depends":{}}' > fabric.mod.json
          zip -q ../bloomlevelup-stand-in.jar fabric.mod.json && cd ..
          WITHOUT="${{ matrix.without }}"
          python3 pack/build_pack.py bloomlevelup-stand-in.jar test pack-out --client-run build/run/clientGameTestPack ${WITHOUT:+--without "$WITHOUT"}
      - name: client game test with the pack
        run: |
          set -o pipefail
          sudo apt-get install -y libgl1-mesa-dri libegl1 libegl-mesa0
          chmod +x ./gradlew
          # Sodium and Iris switch the game to OpenGL (see build.gradle), and Xvfb's GLX has no visual the game
          # accepts: no X at all, SDL's offscreen video driver (OpenGL through Mesa's EGL, software rendering).
          SDL_VIDEO_DRIVER=offscreen ./gradlew runClientGameTestPack --stacktrace 2>&1 | tee client-pack.log
      - name: report
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('client-pack.log'):
              raise SystemExit(0)
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          noise = re.compile(r'flite|Narrator|text2speech|sessionserver|SocketTimeout|Read timed out|NioSocketImpl|authlib|Realms|cardinal-components-api.properties|UnixException|UnixFileSystemProvider|Files.newByteChannel')
          lines = [l if len(l) < 400 else l[:400] + ' ...' for l in open('client-pack.log', encoding='utf-8', errors='replace').read().splitlines()]
          lines = [l for l in lines if not noise.search(l)]
          tests = [l for l in lines if 'BLOOMTEST' in l]
          census = [l.split('BLOOMCENSUS ', 1)[1] for l in lines if 'BLOOMCENSUS ' in l and '/INFO]' in l]
          if census:
              text = chr(10).join(census)
              for n, i in enumerate(range(0, min(len(text), 3900 * 9), 3900)):
                  print(f"::error title=client-pack-census-{n:02d}::{esc(text[i:i + 3900])}")
          print(f"::notice title=client-pack-checks::{esc(chr(10).join(t[:600] for t in tests)[:3900] or 'no BLOOMTEST lines')}")
          # Each attempt: what happened after the game reached the title screen (or the last 80 lines before it).
          starts = [i for i, l in enumerate(lines) if re.search(r'Loading \d+ mods', l)] or [0]
          for n, begin in enumerate(starts[:2]):
              finish = starts[n + 1] if n + 1 < len(starts) else len(lines)
              part = lines[begin:finish]
              keep = [l for l in part if re.search(r'BLOOMTEST|has the following entity data|ERROR|FATAL|Exception|Caused by|AssertionError|Timeout|timed out|failed|Failed|What went wrong|\tat net\.fabricmc|\tat knot//com\.freshorangeslices', l)]
              text = '\n'.join(dict.fromkeys(keep[-120:])) + '\n-- last lines --\n' + '\n'.join(part[-40:])
              chunks = [text[i:i + 3900] for i in range(0, len(text), 3900)][:6]
              for m, chunk in enumerate(chunks):
                  print(f"::warning title=client-pack-attempt{n + 1}-{m:02d}::{esc(chunk)}")
          loading = [l for l in lines if re.search(r'Loading \d+ mods', l)]
          if loading:
              start = lines.index(loading[0])
              mods = [l for l in lines[start + 1:start + 400] if l.startswith('\t- ')]
              print(f"::notice title=client-pack-mods::{esc(loading[0] + chr(10) + ' '.join(m.strip()[2:] for m in mods)[:3800])}")
          # Bug hunting: every distinct warning and error, grouped by the mod that logged it (numbers and ids
          # folded so repeats count once), most frequent first.
          import collections
          raw = open('client-pack.log', encoding='utf-8', errors='replace').read().splitlines()
          groups = collections.defaultdict(collections.Counter)
          for line in raw:
              m = re.match(r'\[[\d:]+\] \[([^\]]+)/(WARN|ERROR)\] \(([^)]+)\) (.*)', line)
              if not m:
                  continue
              text = re.sub(r'\d+(\.\d+)?', '#', m.group(4))[:180]
              groups[(m.group(3), m.group(2))][text] += 1
          report = []
          for (logger, level), counter in sorted(groups.items(), key=lambda kv: -sum(kv[1].values())):
              report.append(f"[{level}] {logger}: {sum(counter.values())} lines, {len(counter)} kinds")
              for text, n in counter.most_common(6):
                  report.append(f"    {n}x {text}")
          text = '\n'.join(report) or 'no warnings or errors'
          for n, i in enumerate(range(0, min(len(text), 3900 * 4), 3900)):
              print(f"::notice title=client-pack-health-{n:02d}::{esc(text[i:i + 3900])}")
          # The game's own warnings, by the mod (namespace) they name: missing textures, broken models, recipes,
          # loot tables, world generation. Vanilla's dev-only translation warnings are left out.
          byns = collections.defaultdict(collections.Counter)
          for line in raw:
              m = re.match(r'\[[\d:]+\] \[[^\]]+/(WARN|ERROR)\] \((?:Minecraft|fabric-[a-z-]+)\) (.*)', line)
              if not m or 'translation key' in m.group(2) or "Can't keep up" in m.group(2):
                  continue
              names = re.findall(r'\b([a-z0-9_.-]+):[a-z0-9_/.-]+', m.group(2))
              ns = next((x for x in names if x not in ('minecraft', 'http', 'https', 'file')), names[0] if names else 'other')
              byns[ns][re.sub(r'\d+', '#', m.group(2))[:200]] += 1
          detail = []
          for ns, counter in sorted(byns.items(), key=lambda kv: -sum(kv[1].values())):
              detail.append(f"{ns}: {sum(counter.values())} lines")
              for line, n in counter.most_common(5):
                  detail.append(f"    {n}x {line}")
          text = '\n'.join(detail) or 'none'
          for n, i in enumerate(range(0, min(len(text), 3900 * 4), 3900)):
              print(f"::notice title=client-pack-game-warnings-{n:02d}::{esc(text[i:i + 3900])}")
          # The lines that follow a few multi-line warnings (Fabric Loader's warnings, the first missing texture).
          follow = []
          for key in ('Warnings were found!', 'Missing texture references in model'):
              at = next((i for i, l in enumerate(raw) if key in l), None)
              if at is not None:
                  follow += raw[at:at + 1] + [l for l in raw[at + 1:at + 16] if not re.match(r'\[[\d:]+\]', l)][:12]
          if follow:
              print(f"::notice title=client-pack-warning-details::{esc(chr(10).join(follow)[:3900])}")
          PY
      - name: capture screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-pack-screenshots-${{ matrix.variant }}
          path: |
            build/run/clientGameTestPack/screenshots
            build/run/clientGameTestPack/logs/latest.log
            build/run/clientGameTestPack/crash-reports
            client-pack.log
          if-no-files-found: ignore

  pack-screenshots:
    needs: client-test-pack
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch screenshots
        uses: actions/download-artifact@v4
        with:
          name: client-pack-screenshots-full
          path: shots
      - name: pillow
        run: pip install --quiet pillow
      - name: after joining (Origins asks for an origin)
        run: python3 .github/scripts/emit_screenshot.py shots pack_join 12
      - name: the world
        run: python3 .github/scripts/emit_screenshot.py shots pack_world 12
      - name: the player (Fresh Animations' player extension)
        run: python3 .github/scripts/emit_screenshot.py shots pack_player 12
      - name: the inventory with accessory slots and Bloom's buttons
        run: python3 .github/scripts/emit_screenshot.py shots pack_inventory 12

  pack-screenshots-2:
    needs: client-test-pack
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch screenshots
        uses: actions/download-artifact@v4
        with:
          name: client-pack-screenshots-full
          path: shots
      - name: pillow
        run: pip install --quiet pillow
      - name: a Better Combat swing
        run: python3 .github/scripts/emit_screenshot.py shots pack_swing 12
      - name: the hub
        run: python3 .github/scripts/emit_screenshot.py shots pack_hub 12
      - name: the shader
        run: python3 .github/scripts/emit_screenshot.py shots pack_shader 12

  # The mob close-ups from each variant, side by side in the checks.
  mob-gallery:
    needs: client-test-pack
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [full]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch screenshots
        uses: actions/download-artifact@v4
        with:
          name: client-pack-screenshots-${{ matrix.variant }}
          path: shots
      - name: pillow
        run: pip install --quiet pillow
      - name: sheep, cow, wandering trader (Details add-on)
        run: python3 .github/scripts/emit_screenshot.py shots pack_mobs_1 12
      - name: zombie, skeleton, creeper (Creepers add-on)
        run: python3 .github/scripts/emit_screenshot.py shots pack_mobs_2 12
      - name: the RPG Series' gear on armor stands (wizard, paladin, archer)
        run: python3 .github/scripts/emit_screenshot.py shots pack_rpg_gear 12
      - name: the player in a wizard's robes with a staff
        run: python3 .github/scripts/emit_screenshot.py shots pack_rpg_player 12
