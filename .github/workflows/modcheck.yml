# Throwaway (never merged): mods FreshOrangeSlices asked about (asked.py).
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - run: python3 check/asked.py
      - run: python3 check/slice.py asked.txt 0 9
