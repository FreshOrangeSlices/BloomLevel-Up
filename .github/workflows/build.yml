# Forge 1.20.1 build (branch forge-1.20.1): builds the mod, runs the unit tests, then boots a real dedicated
# server with it and runs the game tests, once as is and once with Better Combat installed (-PwithBetterCombat).
# The finished jar is attached to each run under "Artifacts" (Actions tab -> the run -> bloomlevelup-jar).

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, bettercombat]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          if [ "${{ matrix.variant }}" = "bettercombat" ]; then
            ./gradlew runGameTestServer -PwithBetterCombat --stacktrace 2>&1 | tee build.log
          else
            ./gradlew build runGameTestServer --stacktrace 2>&1 | tee build.log
          fi
      # Always leave a one-line game test summary on the run (readable through the checks API).
      - name: report game tests
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('build.log'):
              raise SystemExit(0)
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          hits = [l.strip() for l in lines if re.search(r'GAME TESTS|required tests|optional tests|tests? failed|failed!|GameTestAssert|Task :runGameTestServer|BLOOMTEST|passed|Better Combat', l)]
          text = '\n'.join(hits[-40:]) or 'no game test output found'
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::notice title=gametest-summary::{esc(text[:3900])}")
          PY
      # Data that fails to load (a tag naming an id 1.20.1 doesn't have, a broken loot table or recipe) only logs a
      # warning and the game carries on without it, so list those warnings on every run.
      - name: report data warnings
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('build.log'):
              raise SystemExit(0)
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          pattern = re.compile(r"(/(WARN|ERROR)\].*(bloomlevelup|Couldn't load tag|Couldn't parse|Parsing error|Failed to load|Unknown|Missing|Invalid|not found|loot|recipe|advancement|tag))|Exception.*bloomlevelup", re.I)
          noise = re.compile(r'Configuration file|Incorrect key|missing mods.toml|ImmediateWindowProvider|Advanced terminal|diffplug|Ambiguity between arguments', re.I)
          hits = list(dict.fromkeys(l.strip() for l in lines if pattern.search(l) and not noise.search(l)))
          text = '\n'.join(hits[:80]) or 'no data warnings'
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for n, i in enumerate(range(0, len(text), 3900)):
              if n < 5:
                  print(f"::notice title=data-warnings-{n:02d}::{esc(text[i:i + 3900])}")
          PY
      # A fingerprint and a virus scan of the jar, shown on the run, so a download can be checked against it.
      - name: check jar
        if: success() && matrix.variant == 'plain'
        run: |
          set +e
          ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-slim.jar' > jars.txt
          sha256sum $(cat jars.txt) | sed 's#build/libs/##' > jar-sha256.txt
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq clamav > /dev/null 2>&1
          sudo systemctl stop clamav-freshclam > /dev/null 2>&1
          sudo freshclam --quiet > /dev/null 2>&1
          clamscan --no-summary $(cat jars.txt) > clam.txt 2>&1
          status=$?
          verdict=$([ $status -eq 0 ] && echo "ClamAV: clean" || echo "ClamAV exit $status: $(tr '\n' ' ' < clam.txt)")
          echo "::notice title=jar-check::Build ${GITHUB_RUN_NUMBER} ($(cut -c1-7 <<< "$GITHUB_SHA")) | SHA-256 $(tr '\n' ' ' < jar-sha256.txt)| $verdict"
      - name: capture build artifacts
        if: success() && matrix.variant == 'plain'
        uses: actions/upload-artifact@v7
        with:
          name: bloomlevelup-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-slim.jar
      # On failure, surface the compiler / test errors as annotations on the run,
      # so they are readable from the run's summary page and the checks API.
      - name: report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('build.log'):
              raise SystemExit(0)
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          keep = []
          for i, line in enumerate(lines):
              if re.search(r'(error:|warning: \[|FAILED|What went wrong|Exception|expected:|> Task .*FAILED|GameTest|gametest|Mixin)', line):
                  keep.extend(lines[max(0, i - 1):i + 6])
          text = '\n'.join(dict.fromkeys(keep)) or '\n'.join(lines[-200:])
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          # Annotations are cut at 4096 chars and capped at 10 per type per step.
          chunks = [text[i:i + 3900] for i in range(0, len(text), 3900)][:30]
          kinds = ['error', 'warning', 'notice']
          for n, chunk in enumerate(chunks):
              print(f"::{kinds[n // 10]} title=build-errors-{n:02d}::{esc(chunk)}")
          PY
      - name: capture test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.variant }}
          path: build/reports/

  # The LegionWareX add-on (addon/): its own small Forge mod for the pack, not part of Bloom. Built with the same
  # Gradle wrapper and game-tested on a real dedicated server with Migamigos loaded; the pack jobs pack its jar in.
  addon:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and game-test the add-on
        run: |
          set -o pipefail
          ./gradlew -p addon build runGameTestServer --stacktrace 2>&1 | tee addon.log
      - name: report game tests
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('addon.log'):
              raise SystemExit(0)
          lines = open('addon.log', encoding='utf-8', errors='replace').read().splitlines()
          hits = [l.strip() for l in lines if re.search(r'GAME TESTS|required tests|tests? failed|failed!|GameTestAssert|Task :runGameTestServer|passed|legionwarex', l)]
          text = '\n'.join(hits[-40:]) or 'no game test output found'
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::notice title=addon-gametest-summary::{esc(text[:3900])}")
          # The add-on's own numbers (terrain survey, spawn search) in full.
          ours = [l.strip() for l in lines if re.search(r'legionwarex (terrain|spawn)', l)]
          for n, i in enumerate(range(0, min(len('\n'.join(ours)), 3900 * 4), 3900)):
              print(f"::notice title=addon-numbers-{n}::{esc(chr(10).join(ours)[i:i + 3900])}")
          # A server that crashed (or never ran the tests) can still leave Gradle happy: say why, and fail.
          if not any('GAME TESTS COMPLETE' in l for l in lines):
              keep = []
              for i, line in enumerate(lines):
                  if re.search(r'/ERROR\]|/FATAL\]|Exception|Caused by|Crash|crash report|Mixin|Missing|Failed', line):
                      keep.extend(lines[i:i + 4])
              text = '\n'.join(dict.fromkeys(keep)) or '\n'.join(lines[-120:])
              for n, chunk in enumerate([text[i:i + 3900] for i in range(0, len(text), 3900)][:8]):
                  print(f"::error title=addon-gametest-crash-{n:02d}::{esc(chunk)}")
              raise SystemExit(1)
          PY
      - name: report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('addon.log'):
              raise SystemExit(0)
          lines = open('addon.log', encoding='utf-8', errors='replace').read().splitlines()
          keep = []
          for i, line in enumerate(lines):
              if re.search(r'(error:|FAILED|What went wrong|Exception|> Task .*FAILED|GameTest|gametest|Could not)', line):
                  keep.extend(lines[max(0, i - 1):i + 6])
          text = '\n'.join(dict.fromkeys(keep)) or '\n'.join(lines[-200:])
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for n, chunk in enumerate([text[i:i + 3900] for i in range(0, len(text), 3900)][:10]):
              print(f"::error title=addon-build-errors-{n:02d}::{esc(chunk)}")
          PY
      - name: capture the add-on jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: legionwarex-addon-jar
          path: addon/build/libs/*.jar

  # A real 1.20.1 client (on a virtual display) makes a world, opens the hub, the stat sheet, a Major's details and
  # the inventory, and screenshots each (src/gametest/.../forge/client/ClientSmokeTest). Client mixins only load
  # here, so this is also what proves them. The second run has Better Combat installed and also plays a Catch!
  # throw and a charged slam.
  client-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, bettercombat]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: setup gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
      - name: client settings
        run: |
          mkdir -p run/config
          # No accessibility/first-run screens, no pausing when the window isn't focused, quiet, small world view.
          printf 'onboardAccessibility:false\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\npauseOnLostFocus:false\nnarrator:0\nrenderDistance:4\nsimulationDistance:5\nguiScale:2\nsoundCategory_master:0.0\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
      - name: client smoke test
        env:
          BLOOM_CLIENT_TEST: '1'
        run: |
          set -o pipefail
          chmod +x ./gradlew
          extra=$([ "${{ matrix.variant }}" = "bettercombat" ] && echo "-PwithBetterCombat" || true)
          timeout 25m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient $extra --stacktrace 2>&1 | tee client.log || true
          cat run/bloomtest-client.txt 2>/dev/null || echo "no result file"
          grep -q '^PASS' run/bloomtest-client.txt
      - name: report client test
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists('client.log'):
              raise SystemExit(0)
          lines = open('client.log', encoding='utf-8', errors='replace').read().splitlines()
          esc = lambda t: t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          keep = []
          for i, line in enumerate(lines):
              if re.search(r'(error:|/ERROR\]|FAILED|What went wrong|Exception|Caused by|Mixin apply|InvalidInjection|BLOOMTEST)', line) and not re.search(r'Failed to load properties|server.properties', line):
                  keep.extend(lines[max(0, i - 1):i + 5])
          text = '\n'.join(dict.fromkeys(keep)) or '\n'.join(lines[-120:])
          chunks = [text[i:i + 3900] for i in range(0, len(text), 3900)][:20]
          kinds = ['warning', 'notice']
          for n, chunk in enumerate(chunks):
              print(f"::{kinds[(n // 10) % 2]} title=client-log-{n:02d}::{esc(chunk)}")
          PY
      - name: capture screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-screenshots-${{ matrix.variant }}
          path: run/screenshots/*.png
          if-no-files-found: ignore

  # Each screenshot printed as annotations (a job can carry 50), so they can be put back together from the checks API.
  screenshots:
    needs: client-test
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shot: [hub_utility, hub_combat, hub_armor, hub_misc, sheet_combat, sheet_combat_details, sheet_armor, hub_major_details, inventory, inventory_book, inventory_book_small, runes, anvil, hud]
        variant: [plain]
        include:
          # With Better Combat: the overhand throw and the charged slam, seen from the front.
          - shot: bc_throw
            variant: bettercombat
          - shot: bc_slam
            variant: bettercombat
          - shot: sheet_combat
            variant: bettercombat
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch screenshots
        uses: actions/download-artifact@v4
        with:
          name: client-test-screenshots-${{ matrix.variant }}
          path: shots
        continue-on-error: true
      - name: pillow
        run: pip install --quiet pillow
      - name: screenshot
        run: python3 .github/scripts/emit_screenshot.py shots bloom_${{ matrix.shot }} 28 ${{ matrix.variant == 'bettercombat' && 'bc' || '' }}

  # LegionWareX (pack/pack.json): FreshOrangeSlices' medieval high-fantasy pack built around Bloom, as a Modrinth pack
  # file (.mrpack) and a server zip, under "Artifacts" as legionwarex. Its mods are in six cumulative layers and each is
  # tested on its own: a real Forge server boots from the layer's server zip the way a friend would start it
  # (installing Forge first), then a real Forge client with the layer's client side starts to the title screen and
  # joins it (pack/launch_test.py: no crash, Fresh Animations and the shader on, every modded creature summoned once).
  # The pack-screenshots jobs print what each saw.
  pack:
    needs: [build, addon]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        layers: [1, 2, 3, 4, 5, 6]
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch the mod jar
        uses: actions/download-artifact@v4
        with:
          name: bloomlevelup-jar
          path: jar
      - name: fetch the add-on jar
        uses: actions/download-artifact@v4
        with:
          name: legionwarex-addon-jar
          path: addon-jar
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: build the pack
        run: python3 pack/build_pack.py "$(ls jar/*.jar | head -1)" "build.${GITHUB_RUN_NUMBER}" out --extra-jar "$(ls addon-jar/*.jar | head -1)" --layers ${{ matrix.layers }} --client-run game
      - name: capture the pack
        if: matrix.layers == 6
        uses: actions/upload-artifact@v7
        with:
          name: legionwarex
          path: |
            out/*.mrpack
            out/*.zip
      - name: boot a server with the pack
        run: python3 pack/boot_server.py "$(ls out/*server.zip | head -1)" server
      # A virtual display, and portablemc (a command-line launcher: installs Forge's client and starts it offline).
      - name: tools for the client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # no man page indexing after each install (it takes minutes)
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick xdotool > /dev/null
          if gh release download v5.0.6 -R theorzr/portablemc -p 'portablemc-*-linux-x86_64-gnu.tar.gz' -D pmc; then
            tar -xzf pmc/*.tar.gz -C pmc
            echo "$PWD/$(dirname "$(ls pmc/*/portablemc | head -1)")" >> "$GITHUB_PATH"
          else
            pip install --user --break-system-packages --quiet "portablemc>=5,<6"
          fi
      - name: pack launch test
        run: |
          portablemc --version
          xvfb-run -a -s "-screen 0 1280x720x24" python3 pack/launch_test.py server game shots
      - name: capture the client's screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pack-screenshots-L${{ matrix.layers }}
          path: |
            shots/*.png
            game/logs/latest.log
            game/crash-reports
            server/bloom-dump.jsonl
            server/legionwarex-terrain.jsonl
            game/tooltips.jsonl
            game/config
            game/options.txt
            server/config
            server/world/serverconfig
          if-no-files-found: ignore

  pack-screenshots:
    needs: pack
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        layers: [1, 2, 3, 4, 5, 6]
        shot: [pack_title, pack_0, pack_back, pack_inventory, pack_mobs]
        # The add-on's bands, called in front of the player: the whole pack only.
        include:
          - layers: 6
            shot: pack_band_war
          - layers: 6
            shot: pack_band_pirate
          # The minimap's radar colors, with one mob of each kind placed around the player.
          - layers: 6
            shot: pack_minimap
          # A pirate chart read where the player stands: the treasure map in hand.
          - layers: 6
            shot: pack_chart
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: fetch screenshots
        uses: actions/download-artifact@v4
        with:
          name: pack-screenshots-L${{ matrix.layers }}
          path: shots
        continue-on-error: true
      - name: pillow
        run: pip install --quiet pillow
      - name: screenshot
        run: python3 .github/scripts/emit_screenshot.py shots bloom_${{ matrix.shot }} 28 L${{ matrix.layers }}
