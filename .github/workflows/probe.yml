name: probe
on: push
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: warionex
          path: art/pack
          run-id: 45090436823
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FreshOrangeSlices/BloomLevel-Up
      - run: curl -sSL -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar && python3 probe/analyse.py art
      - if: always()
        run: python3 probe/emit.py 0 30
      - run: python3 probe/emit.py 30 30
      - run: python3 probe/emit.py 60 30
