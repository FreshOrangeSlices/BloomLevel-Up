name: api-dump
on:
  push:
    branches: ['ci/api-dump*']
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew printClasspath --no-configuration-cache -q
      - name: javap
        run: |
          set +e
          CP="$(cat build/cp.txt)"
          dump() { echo "=== $1"; javap -p -cp "$CP" "$1" 2>&1 | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g' | { if [ -n "$2" ]; then grep -E "class |interface |enum |$2"; else cat; fi; }; }
          code() { echo "=== CODE $1 :: $2"; javap -c -p -cp "$CP" "$1" 2>&1 | awk -v pat="$2" 'BEGIN{p=0} /^  [a-z].*\(/ { p = ($0 ~ pat) } p { print }' | sed -E 's/net\/minecraft\///g; s/net\.minecraft\.//g' | grep -vE '^\s+[0-9]+: (aload|iload|fload|dload|astore|istore|fstore|dstore|dup|pop|iconst|fconst|dconst|aconst_null|ldc|bipush|sipush|i2f|f2d|d2f|i2d|f2i|checkcast|return|areturn|ireturn|freturn)' ; }
          full() { echo "=== FULL $1 :: $2"; javap -c -p -cp "$CP" "$1" 2>&1 | awk -v pat="$2" 'BEGIN{p=0} /^  [a-z].*\(/ { p = ($0 ~ pat) } p { print }' | sed -E 's/net\/minecraft\///g; s/net\.minecraft\.//g' | grep -vE '^\s*$' ; }
          {
          dump net.minecraft.world.entity.projectile.arrow.AbstractArrow 'pierc|Pierc|HitEntit|hitTarget|stepMove|canHitEntity|onHit|inGround|deflect|class '
          full net.minecraft.world.entity.projectile.arrow.AbstractArrow 'canHitEntity|hitTargetsOrDeflectSelf|stepMoveAndHit|findHitEntities'
          full net.minecraft.world.entity.projectile.arrow.AbstractArrow 'void onHitEntity'
          full net.minecraft.world.entity.projectile.arrow.ThrownTrident 'onHitEntity|findHitEntit|void tick'
          dump net.minecraft.world.entity.projectile.Projectile 'deflect|hitTargetOrDeflectSelf|lastDeflectedBy'
          full net.minecraft.world.entity.projectile.Projectile 'hitTargetOrDeflectSelf|boolean deflect'
          dump net.minecraft.world.entity.projectile.ProjectileDeflection
          dump net.minecraft.world.level.storage.ValueInput 'Float|Boolean|getInt'
          dump net.minecraft.world.level.storage.ValueOutput 'Float|Boolean|putInt'
          } > dump.txt 2>&1
          wc -c dump.txt
      - name: publish (1)
        run: python3 emit.py 0 30
      - name: publish (2)
        run: python3 emit.py 30 50
