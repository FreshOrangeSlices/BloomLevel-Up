modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/FreshOrangeSlices/BloomLevel-Up/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/FreshOrangeSlices/BloomLevel-Up"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional: the keepsakes and the wild despawning are for its companions.
[[dependencies.${mod_id}]]
modId="migamigos"
mandatory=false
versionRange="[0.1,)"
ordering="AFTER"
side="BOTH"

# Optional: war bands take its illagers.
[[dependencies.${mod_id}]]
modId="illagerinvasion"
mandatory=false
versionRange="[8,)"
ordering="AFTER"
side="BOTH"

# Optional: pirate bands are its pirates.
[[dependencies.${mod_id}]]
modId="block_factorys_bosses"
mandatory=false
versionRange="[2,)"
ordering="AFTER"
side="BOTH"
