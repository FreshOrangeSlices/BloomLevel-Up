# Throwaway (never merged): the pack's natural spawns, from a pack run's artifacts (spawnscan.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: echo "RUN_ID=$(cat check/run-id.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: pack-screenshots-L6
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: legionwarex
          path: pack
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          find shots -maxdepth 3 | head -30
          mkdir -p data-out/table
          d="$(find shots -name bloom-dump.jsonl | head -1)"
          grep -E '"kind": ?"(biome|structure|entity)"' "$d" > data-out/table/spawn-dump.jsonl || true
          c="$(find shots -type d -name config | head -1)"; [ -n "$c" ] && tar -czf data-out/table/config.tgz -C "$(dirname "$c")" config
          s="$(find shots -type d -name serverconfig | head -1)"; [ -n "$s" ] && tar -czf data-out/table/serverconfig.tgz -C "$(dirname "$s")" serverconfig
          ls -la data-out/table | tee summary.txt
          echo "::notice title=table::$(tr '\n' '|' < summary.txt)"
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          mkdir -p data/table && cp data-out/table/* data/table/ && cd data && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "pack spawn table" && git push -q origin ci/data && echo pushed
