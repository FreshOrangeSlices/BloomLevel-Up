name: api-dump
on:
  push:
    branches: ['ci/api-dump*']
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew printClasspath --no-configuration-cache -q
      - name: javap
        run: |
          set +e
          CP="$(cat build/cp.txt)"
          dump() { echo "=== $1"; javap -p -cp "$CP" "$1" 2>&1 | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g' | { if [ -n "$2" ]; then grep -E "class |interface |enum |$2"; else cat; fi; }; }
          code() { echo "=== CODE $1 :: $2"; javap -c -p -cp "$CP" "$1" 2>&1 | awk -v pat="$2" 'BEGIN{p=0} /^  [a-z].*\(/ { p = ($0 ~ pat) } p { print }' | sed -E 's/net\/minecraft\///g; s/net\.minecraft\.//g' | grep -vE '^\s+[0-9]+: (aload|iload|fload|dload|astore|istore|fstore|dstore|dup|pop|iconst|fconst|dconst|aconst_null|ldc|bipush|sipush|i2f|f2d|d2f|i2d|f2i|checkcast|return|areturn|ireturn|freturn)' ; }
          {
          for slug in owo-lib yacl patchouli geckolib worldedit carpet neat torohealth-damage-indicators damage-numbers health-indicators mob-health-display lambdynamiclights jade-addons modmenu cloth-config; do
            code=$(curl -s -o v.json -w '%{http_code}' -G "https://api.modrinth.com/v2/project/$slug/version" --data-urlencode 'loaders=["fabric","datapack"]' --data-urlencode 'game_versions=["26.3"]' -H 'User-Agent: FreshOrangeSlices/BloomLevel-Up compat check')
            if [ "$code" != "200" ]; then echo "$slug: HTTP $code"; continue; fi
            python3 -c "import json;v=json.load(open('v.json'));print('$slug:', (str(len(v))+' builds, latest '+v[0]['version_number']+' ['+v[0]['version_type']+'] '+v[0]['date_published'][:10]+' loaders='+','.join(v[0]['loaders'])) if v else 'NO 26.3 build')"
          done
          } > dump.txt 2>&1
          wc -c dump.txt
      - name: publish (1)
        run: python3 emit.py 0 30
      - name: publish (2)
        run: python3 emit.py 30 50
