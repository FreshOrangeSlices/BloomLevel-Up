name: api-dump
on:
  push:
    branches: ['ci/api-dump*']
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew printClasspath --no-configuration-cache -q
      - name: javap
        run: |
          CP="$(cat build/cp.txt)"
          dump() { echo "=== $1"; javap -p -cp "$CP" "$1" 2>&1 | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g' | { if [ -n "$2" ]; then grep -E "class |interface |enum |$2"; else cat; fi; }; }
          {
          dump net.minecraft.world.entity.player.Player 'attack|crit|sweep|Sweep|AttackStrength|Critical|critical|Knockback|EnchantedDamage|itemAttackInteraction|deflect|getCurrentItemAttackStrengthDelay|canAttack|isSprinting|magicCrit|attackVisual|setLastHurtMob|stabAttack|lungeAttack'
          dump net.minecraft.world.entity.LivingEntity 'actuallyHurt|die\(|getDamageAfterArmorAbsorb|getDamageAfterMagicAbsorb|getArmorValue|hurtArmor|LastHurtByPlayer|lastHurtByPlayer|knockback\(|getKillCredit|getAbsorptionAmount|getWeaponItem|doHurtTarget|causeFallDamage|calculateFallDamage|AutoSpinAttack|isInWaterOrRain|dropAllDeathLoot|spawnAtLocation|setItemSlot|getEquipmentDropChance|kill|swing\('
          dump net.minecraft.world.damagesource.CombatRules
          dump net.minecraft.world.item.enchantment.EnchantmentHelper 'getEnchantmentLevel|processAmmoUse|getItemEnchantmentLevel|SpinAttack|Piercing|getTridentReturnToOwnerAcceleration|modifyDamage|getDamageProtection|getFishingLuckBonus|modifyCrossbowChargingTime|doPostAttackEffects'
          dump net.minecraft.world.item.enchantment.Enchantments 'LOOTING|PIERCING|RIPTIDE|LOYALTY|class '
          dump net.minecraft.world.item.ProjectileWeaponItem
          dump net.minecraft.world.item.CrossbowItem
          dump net.minecraft.world.item.BowItem
          dump net.minecraft.world.item.TridentItem
          dump net.minecraft.world.item.MaceItem
          dump net.minecraft.world.entity.projectile.arrow.AbstractArrow
          dump net.minecraft.world.entity.projectile.arrow.ThrownTrident
          dump net.minecraft.world.entity.projectile.ThrownTrident
          dump net.minecraft.world.entity.projectile.windcharge.AbstractWindCharge 'explode|class |EXPLOSION|DAMAGE_CALC'
          dump net.minecraft.world.level.Level 'explode\('
          dump net.minecraft.world.effect.MobEffect
          dump net.minecraft.core.Registry 'register|class '
          dump net.minecraft.core.registries.BuiltInRegistries 'MOB_EFFECT|class '
          dump net.minecraft.world.damagesource.DamageSource 'DamageSource\(|class '
          dump net.minecraft.core.particles.ParticleTypes 'ELECTRIC_SPARK|SWEEP_ATTACK|CRIT|DAMAGE_INDICATOR|GUST|ENCHANTED_HIT|class '
          dump net.minecraft.sounds.SoundEvents 'PLAYER_ATTACK_CRIT|PLAYER_ATTACK_SWEEP|TRIDENT_THUNDER|LIGHTNING_BOLT|WIND_CHARGE_BURST|MACE_SMASH|ITEM_BREAK|class '
          dump net.minecraft.tags.ItemTags 'SWORDS|SPEAR|AXES|MACE|TRIDENT|BOW|CROSSBOW|ARROWS|class '
          dump net.minecraft.tags.EntityTypeTags 'BOSS|class '
          dump net.minecraft.world.entity.Mob 'setItemSlot|getItemBySlot|setDropChance|class |setGuaranteedDrop'
          dump net.minecraft.world.entity.Entity 'spawnAtLocation|fallDistance|getKnownMovement|isInWaterOrRain|getBoundingBox|isAlliedTo|tickCount|setNoGravity|isNoGravity|distanceTo\('
          dump net.minecraft.world.entity.OwnableEntity
          dump net.minecraft.world.entity.ai.attributes.Attributes 'SWEEPING|ENTITY_INTERACTION|ATTACK_DAMAGE|ATTACK_KNOCKBACK|class '
          dump net.minecraft.world.entity.decoration.ArmorStand 'class '
          dump net.minecraft.world.entity.decoration.armorstand.ArmorStand 'class '
          dump net.minecraft.world.item.Item 'getAttackDamageBonus|hurtEnemy|postHurtEnemy|getUseDuration|releaseUsing|class '
          dump net.minecraft.core.component.DataComponents 'KINETIC|PIERCE|SWING|WEAPON|ATTACK_RANGE|CHARGED|INTANGIBLE|class '
          dump net.minecraft.world.item.component.KineticWeapon
          dump net.minecraft.world.item.component.Weapon
          dump net.minecraft.world.item.component.ChargedProjectiles
          dump net.minecraft.world.damagesource.DamageSources 'trident|arrow|lightningBolt|playerAttack|mobProjectile|spear|mace|windCharge|indirectMagic|class '
          dump net.minecraft.world.entity.projectile.ProjectileUtil 'getHitResult|class '
          dump net.minecraft.world.level.ExplosionDamageCalculator 'class '
          dump net.minecraft.world.level.SimpleExplosionDamageCalculator
          dump net.minecraft.world.entity.player.Inventory 'getSelectedItem|selected|class '
          dump net.minecraft.server.level.ServerPlayer 'crit|magicCrit|sendSystemMessage|connection|class '
          dump net.minecraft.world.entity.projectile.Projectile 'shootFromRotation|shoot\(|getOwner|class '
          } > dump.txt 2>&1
          wc -c dump.txt
      - name: publish (1)
        run: python3 emit.py 0 30
      - name: publish (2)
        run: python3 emit.py 30 50
