plugins {
	id 'eclipse'
	id 'idea'
	id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

// The LegionWareX add-on for Forge 1.20.1. It reaches the mods it adds to through their entity tags and saved data
// (no compile-time dependency), so it builds and runs on its own and does nothing for a mod that isn't installed.

def buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = "${project.version}+${buildNumber ? "build." + buildNumber : "local"}"
group = project.group

base {
	archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

configurations {
	gametestImplementation.extendsFrom implementation
	gametestCompileOnly.extendsFrom compileOnly
}

minecraft {
	mappings channel: mapping_channel, version: mapping_version
	copyIdeResources = true

	runs {
		configureEach {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'info'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}

		client {
			property 'forge.enabledGameTestNamespaces', mod_id
		}

		server {
			property 'forge.enabledGameTestNamespaces', mod_id
			args '--nogui'
		}

		// A real dedicated server with Migamigos, Illager Invasion and Bosses'Rise boots, runs the @GameTest methods in
		// src/gametest and stops
		// (`./gradlew -p addon runGameTestServer`).
		gameTestServer {
			workingDirectory project.file('run/gametest')
			property 'forge.enabledGameTestNamespaces', mod_id

			mods {
				"${mod_id}" {
					source sourceSets.main
					source sourceSets.gametest
				}
			}
		}
	}
}

repositories {
	mavenCentral()
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = 'CurseMaven'
		url = 'https://cursemaven.com'
		content {
			includeGroup 'curse.maven'
		}
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	// The mods the add-on works with, and what they need, in the dev runs only, for the game tests: Migamigos
	// (companions), Illager Invasion (war bands) and Bosses'Rise (pirate bands).
	runtimeOnly fg.deobf("maven.modrinth:migamigos:${migamigos_version}")
	runtimeOnly fg.deobf("maven.modrinth:geckolib:${geckolib_version}")
	runtimeOnly fg.deobf("curse.maven:framework-549225:${framework_file}")
	runtimeOnly fg.deobf("maven.modrinth:illager-invasion:${illager_invasion_version}")
	runtimeOnly fg.deobf("maven.modrinth:puzzles-lib:${puzzles_lib_version}")
	runtimeOnly fg.deobf("maven.modrinth:bossesrise:${bossesrise_version}")
}

def resourceProps = [
		minecraft_version      : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		forge_version          : forge_version,
		forge_version_range    : forge_version_range,
		loader_version_range   : loader_version_range,
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_version            : version,
		mod_authors            : mod_authors,
		mod_description        : mod_description,
]

tasks.named('processResources', ProcessResources).configure {
	inputs.properties resourceProps

	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand resourceProps + [project: project]
	}
}

tasks.named('jar', Jar).configure {
	manifest {
		attributes([
				'Specification-Title'     : mod_id,
				'Specification-Vendor'    : mod_authors,
				'Specification-Version'   : '1',
				'Implementation-Title'    : project.name,
				'Implementation-Version'  : project.jar.archiveVersion,
				'Implementation-Vendor'   : mod_authors,
		])
	}
	finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}
