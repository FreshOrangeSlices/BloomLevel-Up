# Throwaway (never merged): the pack's weapons, from a pack run's artifacts (weapons.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - run: echo "RUN_ID=$(cat check/run-id.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: pack-screenshots-L6
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: legionwarex
          path: pack
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          find shots pack -maxdepth 3 | head -20
          python3 check/weapons.py "$(find shots -name bloom-dump.jsonl | head -1)" "$(ls pack/*server.zip | head -1)" data-out/weapons | tee summary.txt
          echo "::notice title=weapons::$(tr '\n' '|' < summary.txt)"
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          mkdir -p data/weapons && cp data-out/weapons/* data/weapons/ && cd data && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "pack weapons" && git push -q origin ci/data && echo pushed
