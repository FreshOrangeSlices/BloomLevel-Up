# Throwaway (never merged): the playtest report round (reports.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: echo "RUN_ID=$(cat check/run-id.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: pack-screenshots-L5
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: legionwarex
          path: pack
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          rm -rf data-out; mkdir -p data-out/reports6
          python3 check/reports6.py "$(ls pack/*server*.zip | head -1)" shots data-out/reports6 | tee log.txt
          echo "::notice title=reports6::$(head -c 3500 data-out/reports6/summary.txt | tr '\n' '|' | sed 's/%/%25/g')"
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf data/reports6 && mkdir -p data/reports6 && cp -r data-out/reports6/* data/reports6/ && cd data && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "reports6" && git push -q origin ci/data && echo pushed
