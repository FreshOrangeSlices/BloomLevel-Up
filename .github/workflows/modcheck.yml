# Throwaway (never merged): facts for the quest book from the pack's mods (questfacts.py), pushed to ci/data.
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: echo "RUN_ID=$(cat check/run-id.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: pack-screenshots-L6
          path: shots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: legionwarex
          path: pack
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - run: |
          rm -rf data-out; mkdir -p data-out/questfacts
          python3 check/findstr.py "$(ls pack/*server*.zip | head -1)" data-out/questfacts/findstr ttv/migami/migamigos/client/KeyBinds && python3 check/javapmod.py "$(ls pack/*server*.zip | head -1)" data-out/questfacts/migamigos Migamigos "(ClientEvents|ClientForgeEvents|KeyInput|ClientTick|AmigoScreen|Ability|Blessing).*\.class$" >> log.txt 2>&1 > log.txt 2>&1 || echo "::error title=py::$(tail -c 3000 log.txt | tr '\n' '|' | sed 's/%/%25/g')"
          echo "::notice title=questfacts::$(head -c 3500 data-out/questfacts/summary.txt | tr '\n' '|' | sed 's/%/%25/g')"
          git clone -q --depth 1 -b ci/data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data 2> git.txt || echo "::error title=clone::$(tr '\n' '|' < git.txt)"
          cp log.txt data-out/questfacts/log.txt
          mkdir -p data/questfacts && cp -r data-out/questfacts/* data/questfacts/ && cd data && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "questfacts" && git push -q origin ci/data 2> ../push.txt && echo pushed || echo "::error title=push::$(tr '\n' '|' < ../push.txt)"
