plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

// Every CI build is stamped with its run number (0.1.0+build.57), so jars can't be mixed up.
// Local builds are 0.1.0+local.
def buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = "${project.version}+${buildNumber ? "build." + buildNumber : "local"}"

repositories {
	mavenCentral()
	// Better Combat and the mods its test run needs (optional compat; nothing from here is bundled).
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	// Mods loaded only into the second game test run (runGameTestBetterCombat), never into the jar or other runs.
	betterCombatRuntime {
		transitive = false
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"bloomlevelup" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// In-game tests: a real dedicated server boots with the mod (so broken mixins fail the build) and runs
	// the @GameTest methods in src/gametest (`./gradlew runGameTest`). Client game tests boot a real client
	// into a singleplayer world (`./gradlew runClientGameTest`, its own CI workflow).
	configureTests {
		createSourceSet = true
		modId = "bloomlevelup-gametest"
		eula = true
		enableGameTests = true
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Better Combat is optional: compiled against, never bundled. Bloom's compat code only runs when it's installed.
	// (Its config class extends Cloth Config's, and its animation hooks use Player Animation Library's types.)
	compileOnly "maven.modrinth:better-combat:${project.better_combat_version}"
	compileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	clientCompileOnly "maven.modrinth:better-combat:${project.better_combat_version}"
	clientCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	clientCompileOnly "maven.modrinth:player-animation-library:${project.player_animation_library_version}"
	gametestCompileOnly "maven.modrinth:better-combat:${project.better_combat_version}"
	gametestCompileOnly "maven.modrinth:cloth-config:${project.cloth_config_version}"
	betterCombatRuntime "maven.modrinth:better-combat:${project.better_combat_version}"
	betterCombatRuntime "maven.modrinth:player-animation-library:${project.player_animation_library_version}"
	betterCombatRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"

	// Unit tests cover the pure-Java core (progression rules, formulas, validation).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The game tests again with Better Combat (and what it needs) loaded: the compat tests run, and everything else has
// to pass with it installed too. The plain runGameTest stays Better Combat-free, so both setups keep working.
def betterCombatMods = layout.buildDirectory.dir("betterCombatMods")

tasks.register("copyBetterCombatMods", Sync) {
	from configurations.betterCombatRuntime
	into betterCombatMods
}

loom.runs.create("gameTestBetterCombat") {
	inherit loom.runs.getByName("gameTest")
	runDir "build/run/gameTestBetterCombat"
	property "fabric.addMods", betterCombatMods.get().asFile.absolutePath
}

// The same for the client game tests: only the Better Combat checks run there (the slam), with screenshots.
loom.runs.create("clientGameTestBetterCombat") {
	inherit loom.runs.getByName("clientGameTest")
	runDir "build/run/clientGameTestBetterCombat"
	property "fabric.addMods", betterCombatMods.get().asFile.absolutePath
}

tasks.matching { it.name == "runGameTestBetterCombat" || it.name == "runClientGameTestBetterCombat" }.configureEach {
	dependsOn "copyBetterCombatMods"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

