plugins {
	id 'eclipse'
	id 'idea'
	id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
}

// Bloom Level-Up for Forge 1.20.1 (this branch). The main branch is the Fabric 26.3 mod; this one is a port of it.

// Every CI build is stamped with its run number (0.1.0+build.57), so jars can't be mixed up.
// Local builds are 0.1.0+local.
def buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = "${project.version}+${buildNumber ? "build." + buildNumber : "local"}"
group = project.group

base {
	archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// The Fabric 26.3 sources share this tree. What is ported to Forge 1.20.1 so far builds; the rest waits here
// (unchanged, for reference) until its chunk is ported. Each chunk removes its lines from this list.
def notPortedYet = [
		// Chunk 4: Better Combat compat, against Better Combat for 1.20.1 (compat/BetterCombat.java is a stand-in until then)
		'**/bloomlevelup/compat/BetterCombatBridge.java',
		'**/bloomlevelup/compat/BetterCombatMoves.java',
		'**/bloomlevelup/compat/BetterCombatMixinPlugin.java',
		'**/bloomlevelup/compat/mixin/**',
		// Fabric-only: the Bloom Pack's launch defaults (resource packs, shader); this build isn't for that pack.
		'**/bloomlevelup/PackDefaultsLaunch.java',
		// Chunk 3: the client (hub, HUD, combat keys, renderers)
		'**/bloomlevelup/client/combat/**',
		'**/bloomlevelup/client/compat/**',
		'**/bloomlevelup/client/gui/**',
		'**/bloomlevelup/client/mixin/**',
		'**/bloomlevelup/client/render/**',
		'**/bloomlevelup/client/IconTextures.java',
		'**/bloomlevelup/client/NameTags.java',
]

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java', 'src/client/java']
			exclude notPortedYet
		}
		resources {
			srcDirs = ['src/main/resources', 'src/client/resources']
			// Fabric metadata and mixin configs (the Forge ones are mods.toml and *.forge.mixins.json).
			exclude 'fabric.mod.json', 'bloomlevelup.mixins.json', 'bloomlevelup.bettercombat.mixins.json',
					'bloomlevelup.client.mixins.json', 'bloomlevelup.bettercombat.client.mixins.json'
		}
	}
	gametest {
		java {
			// Only the Forge game tests for now; the Fabric ones next to them are ported with their chunks.
			srcDirs = ['src/gametest/java']
			include '**/gametest/forge/**'
		}
		resources {
			// The game tests' empty structure (data/bloomlevelup/structures/empty.nbt).
			srcDirs = ['src/gametest/resources']
			exclude 'fabric.mod.json'
		}
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	test {
		java {
			// The unit tests cover the pure-Java core, which is the same on every loader.
			srcDirs = ['src/test/java']
		}
	}
}

configurations {
	gametestImplementation.extendsFrom implementation
	gametestCompileOnly.extendsFrom compileOnly
	gametestAnnotationProcessor.extendsFrom annotationProcessor
}

minecraft {
	mappings channel: mapping_channel, version: mapping_version
	copyIdeResources = true

	runs {
		configureEach {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'info'
			property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}

		client {
			property 'forge.enabledGameTestNamespaces', mod_id
		}

		server {
			property 'forge.enabledGameTestNamespaces', mod_id
			args '--nogui'
		}

		// A real dedicated server boots with the mod (so registries, data, capabilities and mixins are proven),
		// runs the @GameTest methods in src/gametest and stops (`./gradlew runGameTestServer`).
		gameTestServer {
			workingDirectory project.file('run/gametest')
			property 'forge.enabledGameTestNamespaces', mod_id

			mods {
				"${mod_id}" {
					source sourceSets.main
					source sourceSets.gametest
				}
			}
		}
	}
}

mixin {
	add sourceSets.main, "${mod_id}.refmap.json"
	config "${mod_id}.forge.mixins.json"
}

repositories {
	mavenCentral()
}

jarJar.enable()

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

	// MixinExtras (WrapOperation, ModifyExpressionValue, ...): bundled inside the jar, so players don't install it.
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
	implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")) {
		jarJar.ranged(it, "[${mixinextras_version},)")
	}

	gametestImplementation sourceSets.main.output

	// Unit tests cover the pure-Java core (progression rules, formulas, validation).
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def resourceProps = [
		minecraft_version      : minecraft_version,
		minecraft_version_range: minecraft_version_range,
		forge_version          : forge_version,
		forge_version_range    : forge_version_range,
		loader_version_range   : loader_version_range,
		mod_id                 : mod_id,
		mod_name               : mod_name,
		mod_license            : mod_license,
		mod_version            : version,
		mod_authors            : mod_authors,
		mod_description        : mod_description,
]

tasks.named('processResources', ProcessResources).configure {
	inputs.properties resourceProps

	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand resourceProps + [project: project]
	}
}

tasks.named('jar', Jar).configure {
	archiveClassifier = 'slim'
	manifest {
		attributes([
				'Specification-Title'     : mod_id,
				'Specification-Vendor'    : mod_authors,
				'Specification-Version'   : '1',
				'Implementation-Title'    : project.name,
				'Implementation-Version'  : project.jar.archiveVersion,
				'Implementation-Vendor'   : mod_authors,
				'MixinConfigs'            : "${mod_id}.forge.mixins.json"
		])
	}
}

// The jar players install: the mod plus MixinExtras inside it, remapped to the names the game uses outside dev.
tasks.named('jarJar').configure {
	archiveClassifier = ''
	manifest {
		attributes([
				'MixinConfigs': "${mod_id}.forge.mixins.json"
		])
	}
}

reobf {
	jarJar {}
}

tasks.named('jarJar').configure { finalizedBy 'reobfJarJar' }
tasks.named('build').configure { dependsOn 'jarJar' }

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}
