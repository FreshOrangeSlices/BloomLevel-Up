pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// The LegionWareX add-on: a separate Forge 1.20.1 mod for the pack (not part of Bloom), built on its own from this
// folder with the repository's Gradle wrapper (`./gradlew -p addon build`).
rootProject.name = 'legionwarex-addon'
