name: api-dump
on:
  push:
    branches: ['ci/api-dump*']
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew printClasspath --no-configuration-cache -q
      - name: javap
        run: |
          set +e
          CP="$(cat build/cp.txt)"
          dump() { echo "=== $1"; javap -p -cp "$CP" "$1" 2>&1 | grep -v '^Compiled from' | sed -E 's/net\.minecraft\.//g; s/java\.lang\.//g; s/java\.util\.//g' | { if [ -n "$2" ]; then grep -E "class |interface |enum |$2"; else cat; fi; }; }
          code() { echo "=== CODE $1 :: $2"; javap -c -p -cp "$CP" "$1" 2>&1 | awk -v pat="$2" 'BEGIN{p=0} /^  [a-z].*\(/ { p = ($0 ~ pat) } p { print }' | sed -E 's/net\/minecraft\///g; s/net\.minecraft\.//g' | grep -vE '^\s+[0-9]+: (aload|iload|fload|dload|astore|istore|fstore|dstore|dup|pop|iconst|fconst|dconst|aconst_null|ldc|bipush|sipush|i2f|f2d|d2f|i2d|f2i|checkcast|return|areturn|ireturn|freturn)' ; }
          {
          dump net.minecraft.world.item.enchantment.EnchantmentHelper 'runIteration|forEachModifier|getEnchantmentLevel|getItemEnchantmentLevel|modifyDamage|modifyKnockback|doPostAttack|getDamageProtection|runLocationChanged|stopLocationBased|Visitor|hasTag|class '
          code net.minecraft.world.item.enchantment.EnchantmentHelper 'void runIterationOnEquipment'
          dump 'net.minecraft.world.item.enchantment.EnchantmentHelper$EnchantmentInSlotVisitor'
          dump 'net.minecraft.world.item.enchantment.EnchantmentHelper$EnchantmentVisitor'
          dump net.minecraft.world.item.enchantment.EnchantedItemInUse
          dump net.minecraft.world.item.enchantment.Enchantment 'matchingSlot|definition|getSlotItems|slots|isSupportedItem|class '
          dump net.minecraft.world.item.enchantment.ItemEnchantments 'EMPTY|keySet|entrySet|getLevel|size|isEmpty|Mutable|class '
          dump net.minecraft.tags.EnchantmentTags 'CURSE|class '
          dump net.minecraft.world.entity.LivingEntity 'getWeaponItem|collectEquipmentChanges|getItemBySlot|activeLocationDependentEnchantments'
          dump net.minecraft.world.entity.player.Player 'getWeaponItem|attack[(]|disableShield|blockUsingItem|hurtCurrentlyUsedShield|ItemCooldowns|getCooldowns'
          code net.minecraft.world.entity.player.Player 'void attack[(]'
          dump net.minecraft.world.inventory.MenuType 'HOPPER|class '
          dump net.fabricmc.fabric.api.entity.event.v1.ServerEntityEvents 'EQUIPMENT_CHANGE|class '
          dump 'net.fabricmc.fabric.api.entity.event.v1.ServerEntityEvents$EquipmentChange'
          dump net.minecraft.world.entity.ai.attributes.AttributeMap 'addTransient|removeAttributeModifiers|getInstance|class '
          dump net.minecraft.world.entity.EquipmentSlot 'VALUES|HEAD|FEET|isArmor|getType|class '
          dump net.minecraft.world.item.ItemStack 'validateStrict|getMaxStackSize|isStackable|limitSize|capAndLimit|MAP_CODEC|CODEC|getCount|setCount|grow|class '
          code net.minecraft.world.item.ItemStack 'static [{][}]|validateStrict|lambda[$]static'
          dump net.minecraft.world.item.ItemStackTemplate 'CODEC|MAP_CODEC|count|class '
          code net.minecraft.world.item.ItemStackTemplate 'static [{][}]|lambda[$]static'
          dump net.minecraft.world.Container 'getMaxStackSize|MAX_STACK|class |interface '
          dump net.minecraft.world.entity.player.Inventory 'getMaxStackSize|addResource|hasRemainingSpaceForItem|getSlotWithRemainingSpace|add[(]|MAX|class '
          code net.minecraft.world.entity.player.Inventory 'int addResource|boolean hasRemainingSpaceForItem|boolean add[(]'
          code net.minecraft.world.inventory.Slot 'getMaxStackSize|safeInsert'
          code net.minecraft.world.inventory.AbstractContainerMenu 'void doClick|boolean moveItemStackTo|getQuickCraftPlaceCount'
          dump net.minecraft.world.ItemStackWithSlot 'CODEC|class '
          dump net.minecraft.world.item.component.BlocksAttacks 'disable|class '
          code net.minecraft.world.item.component.BlocksAttacks 'disable'
          dump net.minecraft.world.entity.LivingEntity 'blockUsingItem|disable|hurtCurrentlyUsedShield'
          dump net.minecraft.client.renderer.entity.EntityRenderer 'NameTag|nameTag|shouldShowName|extractRenderState|class '
          dump net.minecraft.client.renderer.entity.player.AvatarRenderer 'Name|name|extractRenderState|class '
          dump net.minecraft.client.renderer.entity.state.EntityRenderState 'nameTag|class '
          dump net.minecraft.client.renderer.entity.state.AvatarRenderState 'name|score|class '
          code net.minecraft.client.renderer.entity.player.AvatarRenderer 'extractRenderState'
          } > dump.txt 2>&1
          wc -c dump.txt
      - name: publish (1)
        run: python3 emit.py 0 30
      - name: publish (2)
        run: python3 emit.py 30 50
