# Throwaway (never merged): boss and creature mods for LegionWareX (bosses.py).
name: modcheck
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          path: check
      - name: bosses
        run: python3 check/bosses.py
      - run: python3 check/slice.py bosses.txt 0 9
      - run: python3 check/slice.py bosses.txt 9 18
      - run: python3 check/slice.py bosses.txt 18 27
