name: mod-check
on:
  push:
    branches: [ "ci/mod-check" ]
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NEW: wizards,paladins-and-priests,archers,rogues-and-warriors,arsenal-rpg-series,armory-rpg-series,jewelry,combat-roll
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: scout
        run: python3 pack/scout5.py
